services:
  - type: web
    name: whatsapp-business-ledger-bot
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: whatsapp-business-ledger-bot
          property: host
