<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Leads Directory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      line-height: 1.8;
      padding: 40px 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #000000;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .meta {
      font-size: 13px;
      color: #333333;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 12px;
    }

    .text-btn {
      background: none;
      border: 1px solid #000000;
      color: #000000;
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }

    .text-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .status-indicator {
      font-size: 12px;
      color: #555555;
    }

    /* Histogram Section */
    #histogram-section {
      display: none;
      margin-top: 24px;
      margin-bottom: 32px;
      padding: 16px;
      border: 1px solid #000000;
      background: #ffffff;
    }

    .hist-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .hist-row {
      display: flex;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
    }

    .hist-label {
      width: 110px;
    }

    .hist-count {
      width: 90px;
      text-align: right;
      padding-right: 16px;
    }

    .hist-bar {
      color: #000000;
    }

    /* Date Separator */
    .date-header {
      font-size: 16px;
      font-weight: 700;
      margin-top: 36px;
      margin-bottom: 16px;
      padding-top: 12px;
      border-top: 1px dashed #000000;
      letter-spacing: 0.5px;
    }

    .date-header:first-of-type {
      margin-top: 16px;
      border-top: none;
      padding-top: 0;
    }

    /* Lead List Items */
    .leads-list {
      list-style: none;
      margin-bottom: 24px;
    }

    .lead-item {
      padding: 4px 0;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      column-gap: 8px;
    }

    .lead-prefix {
      font-weight: 700;
    }

    /* Colors */
    .lead-num-red {
      color: #d32f2f;
      font-weight: 700;
    }

    .lead-num-yellow {
      color: #b45309;
      font-weight: 700;
    }

    .lead-num-green {
      color: #15803d;
      font-weight: 700;
    }

    .lead-num-black {
      color: #000000;
      font-weight: 700;
    }

    .lead-score {
      color: #000000;
      font-weight: 600;
    }

    .lead-separator {
      color: #000000;
    }

    .lead-note {
      color: #000000;
      font-weight: 400;
    }

    .legend {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666666;
      line-height: 1.8;
    }

    .legend-item {
      display: inline-block;
      margin-right: 20px;
    }

    .loading-text {
      padding: 24px 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">Sales Leads Directory</div>
    <div class="meta" id="header-meta">
      Loading leads since 1 November 2026...
    </div>
    <div class="controls">
      <button id="toggle-hist-btn" class="text-btn" type="button">[ Show Weekly Orders Histogram ]</button>
      <button id="refresh-btn" class="text-btn" type="button">[ Refresh Now ]</button>
      <span class="status-indicator" id="live-indicator">Live sync active</span>
    </div>
  </header>

  <!-- Weekly Orders Histogram (Toggled by text button) -->
  <section id="histogram-section">
    <div class="hist-title">Weekly Average Orders Distribution (weeklyAvgOrders)</div>
    <div id="histogram-content">Loading...</div>
  </section>

  <!-- Leads Output Container -->
  <main id="leads-container">
    <div class="loading-text">Loading sales leads...</div>
  </main>

  <footer class="legend">
    <div class="legend-item"><span class="lead-num-red">Red</span> = No note yet (uncontacted)</div>
    <div class="legend-item"><span class="lead-num-black">Black</span> = Has note, 0 bills</div>
    <div class="legend-item"><span class="lead-num-yellow">Yellow</span> = 1 day billed</div>
    <div class="legend-item"><span class="lead-num-green">Green</span> = 2+ days billed</div>
    <div class="legend-item">[Score] = weeklyAvgOrders</div>
  </footer>

  <script>
    let isHistogramVisible = false;
    let pollInterval = null;

    const histBtn = document.getElementById('toggle-hist-btn');
    const histSection = document.getElementById('histogram-section');
    const refreshBtn = document.getElementById('refresh-btn');
    const container = document.getElementById('leads-container');
    const headerMeta = document.getElementById('header-meta');
    const histContent = document.getElementById('histogram-content');
    const liveIndicator = document.getElementById('live-indicator');

    histBtn.addEventListener('click', () => {
      isHistogramVisible = !isHistogramVisible;
      histSection.style.display = isHistogramVisible ? 'block' : 'none';
      histBtn.textContent = isHistogramVisible ? '[ Hide Histogram ]' : '[ Show Weekly Orders Histogram ]';
    });

    refreshBtn.addEventListener('click', () => {
      refreshBtn.textContent = '[ Refreshing... ]';
      fetchLeads().finally(() => {
        refreshBtn.textContent = '[ Refresh Now ]';
      });
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderHistogram(histogram) {
      if (!Array.isArray(histogram) || histogram.length === 0) {
        histContent.innerHTML = '<div>No data available</div>';
        return;
      }

      let html = '';
      histogram.forEach(h => {
        const paddedRange = h.range.padEnd(11, ' ');
        const countStr = `${h.count} leads`.padStart(9, ' ');
        const pctStr = `(${h.percentage}%)`.padStart(8, ' ');
        html += `<div class="hist-row">` +
          `<span class="hist-label">[ ${escapeHtml(paddedRange)} ]</span>` +
          `<span class="hist-count">${escapeHtml(countStr)} ${escapeHtml(pctStr)}</span>` +
          `<span class="hist-bar">${escapeHtml(h.bar)}</span>` +
          `</div>`;
      });
      histContent.innerHTML = html;
    }

    function renderLeads(data) {
      headerMeta.textContent = `Scope: All leads since 1 Nov 2026 | Total: ${data.totalLeads} leads`;

      renderHistogram(data.histogram);

      if (!data.dateGroups || data.dateGroups.length === 0) {
        container.innerHTML = '<div class="loading-text">No leads found since 1 November 2026.</div>';
        return;
      }

      let html = '';
      data.dateGroups.forEach(group => {
        html += `<div class="date-header">--- ${escapeHtml(group.formattedDate || group.date)} ---</div>`;
        html += `<ul class="leads-list">`;
        group.leads.forEach(lead => {
          const colorClass = `lead-num-${lead.color || 'black'}`;
          const noteHtml = lead.note ? ` <span class="lead-separator">-</span> <span class="lead-note">${escapeHtml(lead.note)}</span>` : '';
          html += `<li class="lead-item">` +
            `<span class="lead-prefix">${lead.index}.</span> ` +
            `<span class="${colorClass}">${escapeHtml(lead.displayNumber)}</span> ` +
            `<span class="lead-score">[${lead.weeklyAvgOrders}]</span>` +
            `${noteHtml}` +
            `</li>`;
        });
        html += `</ul>`;
      });

      container.innerHTML = html;
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      liveIndicator.textContent = `Live: Connected (${timeStr})`;
    }

    async function fetchLeads() {
      try {
        const res = await fetch('/api/sales/leads');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderLeads(data);
      } catch (err) {
        liveIndicator.textContent = `Live: Connection retry... (${err.message})`;
      }
    }

    // Initial load
    fetchLeads();

    // Auto-poll every 4 seconds for immediate updates when notes are written in WhatsApp
    pollInterval = setInterval(fetchLeads, 4000);
  </script>
</body>
</html>
