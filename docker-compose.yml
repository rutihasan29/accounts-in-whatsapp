services:
  news-voice-bot:
    build: .
    container_name: news-voice-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3050}:3050"
    volumes:
      # Persistent SQLite ledger database and WhatsApp Web authentication session
      - ./data:/app/data
      - ./.wwebjs_auth:/app/.wwebjs_auth
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1536M
